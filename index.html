<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Buscador de Películas</title>
	<link
		rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		crossorigin="anonymous"
	/>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<main class="container py-4 py-md-5">
		<section class="app-card mx-auto p-3 p-md-4 shadow-sm rounded-4">
			<h1 class="h3 mb-2">Buscador de Películas</h1>
			<p class="text-muted mb-4">Busca películas con información de OMDb.</p>

			<div class="row g-2 align-items-end mb-3">
				<div class="col-12 col-md-8">
					<label for="movie-input" class="form-label">Nombre de la película</label>
					<input
						id="movie-input"
						type="text"
						class="form-control"
						placeholder="Ej: Interstellar"
					/>
				</div>
				<div class="col-12 col-md-4 d-grid">
					<button id="search-btn" class="btn btn-primary" type="button">Buscar</button>
				</div>
			</div>

			<p id="status" class="small text-secondary mb-3"></p>
			<div id="results" class="row g-3"></div>
		</section>
	</main>

	<script src="script.js"></script>
</body>
</html>
